[project]
name = "teochew-resynth"
version = "0.1.0"
description = "WORLD-vocoder analysis and resynthesis of the project's own syllable clips (issue #259)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "BSD-3-Clause"
dependencies = [
  "numpy>=1.26",
  "pyworld>=0.3.4",
  "soundfile>=0.12",
]

[project.scripts]
resynth = "resynth.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "resynth"
