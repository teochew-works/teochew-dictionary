name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/core/package-lock.json
      - run: npm ci
      - run: npm run check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web

  # The Python DSP tool behind `audio:grade`/`audio:synthesize` (issue #259).
  # Its own job on purpose: `check` stays Node-only and offline (ADR-0012).
  resynth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/resynth
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/resynth/uv.lock
      - run: uv sync --locked
      - run: uv run pytest

  # The VITS training tool (issue #260). Only its own tests run here — the
  # NumPy alignment search and the dataset reader; no model is trained in CI.
  tts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/tts
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/tts/uv.lock
      - run: uv sync --locked
      - run: uv run pytest
