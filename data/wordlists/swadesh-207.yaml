# Swadesh 207-word list (Swadesh's 1971 revision), used as the headword
# checklist for issue #5 — "how complete are we?" now has a defined
# denominator instead of ad-hoc growth. `headword` is the Han-character form
# judged to be idiomatic, colloquial Teochew (matching this project's existing
# conventions: 儂 not 人, variant 汝 not 你 alone, 睏 not 睡, 行 not 走, 啉/食
# not 喝/吃 — see data/entries/*.yaml), not simply a Mandarin gloss.
#
# `status` lifecycle:
#   existing    - already a headword in data/entries/ (see entry_id)
#   to_fetch    - chosen headword not yet run through the importer
#   staged      - importer produced a proposal in data/staging/wiktionary.yaml
#   no_reading  - importer found no usable Teochew reading (see the `misses`
#                 list in data/staging/wiktionary.yaml)
#
# Headword choices for `to_fetch` items are my best inference from Southern
# Min / Teochew lexicographic convention, not a native speaker's confirmation.
# Where I'm materially unsure - character choice, colloquial vs. literary
# register, a compound standing in for a single morpheme, or a genuine
# homograph shared with another item on this list - I've added a `note`. The
# importer's own Peng'im validation is a first check; final confirmation
# before any merge still needs a speaker, per this project's existing
# needs_review convention (see data/phonology/REVIEW.md).
#
# This is a snapshot, hand-updated after each import run - not recomputed by
# a script.

