# Starter deck marketplace catalog (issue #199) — 20 themed word lists, 40
# words each, transcribed from the issue's own curation. Each item's
# `headword` is resolved to a current entry id at build time
# (src/build/starter-decks.ts); a headword with no matching entry in
# data/entries/ is dropped from that deck's compiled `cards` and reported,
# not hand-added here — staging a missing headword through the importer
# (ADR-0006) and merging it into data/entries/ is separate, deliberately
# out-of-band work.
#
# Every headword below is a starting-point Mandarin/written-Chinese gloss for
# someone to assign a pengim reading to, not a verified Teochew colloquial
# form. Where the issue offered two alternative headwords (e.g. "媽/母" for
# "mother"), the first is used as the resolvable `headword` and the other is
# recorded in `note` — picking a firm form for build-time resolution isn't a
# linguistic judgment call, just a mechanical choice of which one to try
# first. Genuine risk flags the issue raised (the Family deck's kinship
# terms above all, also the 番薯 sweet-potato ambiguity) are preserved in
# `note` too, verbatim in spirit.
#
# The Family deck is the highest-risk in this pack: Teochew (like most
# Southern Min varieties) distinguishes paternal vs. maternal grandparents
# and elder vs. younger siblings/uncles/aunts in ways the Mandarin glosses
# below don't capture 1:1. It ships here, flagged, per the issue's own call
# to include rather than omit it — a native speaker's review is still
# required before any of it is treated as verified, per this project's
# needs_review convention (ADR-0003).

