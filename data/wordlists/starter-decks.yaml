# Starter deck marketplace catalog (issue #199) — 20 themed word lists, 40
# words each, transcribed from the issue's own curation. Each item's
# `headword` is resolved to a current entry id at build time
# (src/build/starter-decks.ts); a headword with no matching entry in
# data/entries/ is dropped from that deck's compiled `cards` and reported,
# not hand-added here — staging a missing headword through the importer
# (ADR-0006) and merging it into data/entries/ is separate, deliberately
# out-of-band work.
#
# Every headword below is a starting-point Mandarin/written-Chinese gloss for
# someone to assign a pengim reading to, not a verified Teochew colloquial
# form. Where the issue offered two alternative headwords (e.g. "媽/母" for
# "mother"), the first is used as the resolvable `headword` and the other is
# recorded in `note` — picking a firm form for build-time resolution isn't a
# linguistic judgment call, just a mechanical choice of which one to try
# first. Genuine risk flags the issue raised (the Family deck's kinship
# terms above all, also the 番薯 sweet-potato ambiguity) are preserved in
# `note` too, verbatim in spirit.
#
# The Family deck is the highest-risk in this pack: Teochew (like most
# Southern Min varieties) distinguishes paternal vs. maternal grandparents
# and elder vs. younger siblings/uncles/aunts in ways the Mandarin glosses
# below don't capture 1:1. It ships here, flagged, per the issue's own call
# to include rather than omit it — a native speaker's review is still
# required before any of it is treated as verified, per this project's
# needs_review convention (ADR-0003).

decks:
  - id: greetings
    name: Greetings & Basic Phrases
    note: "The first thing any learner needs."
    items:
      - headword: "你好"
        gloss: "Hello"
      - headword: "早安"
        gloss: "Good morning"
      - headword: "晚安"
        gloss: "Good evening/night"
      - headword: "如何"
        gloss: "how, in what way"
        note: "substitute for missing headword 你好嗎 (How are you) — 你好嗎 is a full sentence not in the dataset; 如何 (basics.yaml) is the closest real interrogative 'how' word for a wellbeing-check greeting"
      - headword: "好"
        gloss: "well"
        note: "substitute for missing headword 我好 (I'm fine/well) — matched gloss \"well\""
      - headword: "多謝"
        gloss: "Thank you"
      - headword: "免客氣"
        gloss: "you're welcome"
        note: "substitute for missing headword 唔使客氣 (You're welcome) — matched gloss \"you're welcome\""
      - headword: "請"
        gloss: "Please"
      - headword: "歹勢"
        gloss: "Sorry/excuse me"
      - headword: "無要緊"
        gloss: "No problem/it's okay"
      - headword: "再見"
        gloss: "Goodbye"
      - headword: "再會"
        gloss: "goodbye, see you again"
        note: "substitute for missing headword 遲下見 (See you later) — 再會 (basics.yaml) is a close farewell synonym; the automated first-choice match (再見) already appears elsewhere in this deck as its own original item, so this avoids a same-deck duplicate"
      - headword: "是"
        gloss: "Yes"
      - headword: "伓"
        gloss: "no"
        note: "substitute for missing headword 毋是 (No) — matched gloss \"no\""
      - headword: "名"
        gloss: "name"
        note: "substitute for missing headword 你叫乜名 (What's your name) — the core concept 'name' itself exists as a headword (basics.yaml), a direct semantic match for the original question"
      - headword: "叫"
        gloss: "to call; to be called"
        note: "substitute for missing headword 我叫... (My name is...) — 叫 (verbs.yaml) is the exact verb 'to be called/named' used in the original sentence, a direct match"
      - headword: "多多指教"
        gloss: "nice to meet you"
        note: "substitute for missing headword 幸會 (Nice to meet you) — matched gloss \"nice to meet you\""
      - headword: "聽無"
        gloss: "to not understand (what one is hearing)"
        note: "substitute for missing headword 我聽無 (I don't understand) — 聽無 (verbs.yaml) is the exact phrase minus the pronoun 我, an almost identical match"
      - headword: "再"
        gloss: "again, once more"
        note: "substitute for missing headword 請再講一遍 (Please say that again) — 再 (basics.yaml) is the core 'again/once more' word from the original request, both 請 and 講 are already used elsewhere"
      - headword: "慢"
        gloss: "slow; sluggish, late"
        note: "substitute for missing headword 慢慢講 (Please speak slowly) — 慢 (descriptives.yaml) is the exact 'slow' word doubled in the original phrase, a direct match"
      - headword: "毋"
        gloss: "not"
        note: "substitute for missing headword 我毋知 (I don't know) — 毋 (basics.yaml) is the negator from the original sentence itself (its own entry even uses 我毋知 as an example), a direct match"
      - headword: "或者"
        gloss: "Maybe"
      - headword: "當然"
        gloss: "Of course"
      - headword: "歡迎"
        gloss: "Welcome"
      - headword: "久"
        gloss: "long (of time), for a long time"
        note: "substitute for missing headword 好久無見 (Long time no see) — 久 (descriptives.yaml) is the 'long time' concept at the heart of the original phrase"
      - headword: "平安"
        gloss: "safe and sound, peaceful, well-being"
        note: "substitute for missing headword 保重 (Take care) — 平安 (descriptives.yaml) captures the 'stay safe/well' sentiment of a parting well-wish, a close semantic match"
      - headword: "食飽未"
        gloss: "Have you eaten? (customary daily greeting)"
        note: "Included deliberately as a stand-in daily greeting — well attested across Southern Min varieties and more authentic than a literal 你好 for casual use."
      - headword: "地方"
        gloss: "place, region, area"
        note: "substitute for missing headword 你對佗位來 (Where are you from) — 地方 (basics.yaml) is the 'place' concept underlying the original question; 對 and 來 are already used elsewhere in the wordlist"
      - headword: "來自"
        gloss: "to come from, to be from"
        note: "substitute for missing headword 我對...來 (I'm from...) — 來自 (verbs.yaml) is the exact verb 'to come from/be from', a direct semantic match distinct from the 地方 pick used for the paired item"
      - headword: "歲"
        gloss: "year(s) old (age), year"
        note: "substitute for missing headword 你幾歲 (How old are you) — 歲 (basics.yaml) is the age classifier at the core of the original question, a direct match"
      - headword: "我愛汝"
        gloss: "I love you"
        note: "substitute for missing headword 我愛你 (I love you) — matched gloss \"i love you\""
      - headword: "新年好"
        gloss: "Happy New Year"
      - headword: "恭喜"
        gloss: "Congratulations"
      - headword: "酒"
        gloss: "alcohol, wine, liquor"
        note: "substitute for missing headword 乾杯 (Cheers! toast) — 酒 (food.yaml) is the drink being toasted, the closest thematic word since both 乾 and 杯 are already used elsewhere"
      - headword: "借問"
        gloss: "Excuse me (to get attention)"
      - headword: "先生"
        gloss: "Sir/Mister"
      - headword: "夫人"
        gloss: "Madam/Ma'am"
      - headword: "小姐"
        gloss: "Miss"
      - headword: "歡迎光臨"
        gloss: "Welcome (to a place)"
      - headword: "運"
        gloss: "fortune; luck; fate"
        note: "substitute for missing headword 好運 (Good luck) — 運 (basics.yaml) is the 'luck/fortune' word itself minus the intensifier 好 (already used elsewhere), a direct match"

