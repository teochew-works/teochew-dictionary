  - id: family
    name: Family & Kinship
    note: >
      Highest-risk deck in this pack. Teochew distinguishes paternal vs.
      maternal grandparents and elder vs. younger siblings/uncles/aunts with
      different words, unlike Mandarin's more collapsed system — most items
      below genuinely don't map 1:1 from the Mandarin glosses and need a
      native speaker's review before this deck is treated as verified.
      A non-native pass (2026-08-31) cross-referenced every item against its
      data/entries/ definition and fixed three outright wrong matches (家 →
      家庭; 婆婆 → 丈母; 姊妹, which stood in for a female-cousin term the
      dataset doesn't have but actually just means "sisters", → 外孫女, an
      accurate and distinct maternal-line grandchild term instead of a
      mislabeled one) — see each item's own note. It also surfaced, without
      fixing, several items worth a native speaker's
      particular attention: 弟/兒/姪 are dictionary-marked bound forms that
      may not stand alone in natural speech (弟 pairs oddly with the
      unbound 阿兄 above it); 娃 (baby) may be a Mandarin loan rather than
      the authentically Southern Min 嬰仔 originally intended; 阿媽/阿公
      mark grandparent as generically paternal only by omission rather than
      an explicit marker, unlike the explicitly "maternal" 外公/外媽; and
      大家官 (in-laws) specifically means the husband's parents from a
      wife's perspective, narrower than the deck's generic "in-laws" gloss.
      None of this substitutes for an actual native speaker's confirmation.
    items:
      - headword: "媽"
        gloss: "mother"
        note: "alt: 母"
      - headword: "爸"
        gloss: "father"
        note: "alt: 父"
      - headword: "阿兄"
        gloss: "older brother"
      - headword: "弟"
        gloss: "younger brother"
        note: "substitute for missing headword 小弟 (younger brother) — matched gloss \"younger brother\""
      - headword: "阿姐"
        gloss: "elder sister"
        note: "substitute for missing headword 阿姊 (older sister) — 阿姐 is an existing near-synonym term for elder sister in data/entries/people.yaml"
      - headword: "阿妹"
        gloss: "younger sister"
        note: "substitute for missing headword 小妹 (younger sister) — matched gloss \"younger sister\""
      - headword: "阿公"
        gloss: "paternal grandfather"
      - headword: "阿媽"
        gloss: "grandmother"
        note: "substitute for missing headword 阿嫲 (paternal grandmother) — 阿媽 is the existing general grandmother term (paternal-grandmother-specific headword not present)"
      - headword: "外公"
        gloss: "maternal grandfather"
      - headword: "外媽"
        gloss: "maternal grandmother"
        note: "substitute for missing headword 外嫲 (maternal grandmother) — matched gloss \"maternal grandmother\""
      - headword: "兒"
        gloss: "son"
        note: "alt: 仔"
      - headword: "走囝"
        gloss: "daughter"
        note: "dataset headword is 走囝, not 女兒 (2 matches, picked first unused)"
      - headword: "翁"
        gloss: "husband"
        note: "alt: 丈夫"
      - headword: "某"
        gloss: "wife"
        note: "alt: 妻"
      - headword: "娃"
        gloss: "baby"
        note: "substitute for missing headword 嬰仔 (baby/child) — matched gloss \"baby\""
      - headword: "家庭"
        gloss: "family, household"
        note: "review fix: the plain headword 家 (originally listed here) resolves in data/entries/ to an unrelated bound-form sense (\"家\" occurring only in 家己 'oneself', pengim ga1) — not the word for family at all. 家庭 (gê1 têng5) is the dataset's actual family/household noun; the deck's original 'alt: 厝內人' idea doesn't exist as its own headword."
      - headword: "阿叔"
        gloss: "uncle (father's younger brother)"
      - headword: "阿伯"
        gloss: "uncle (father's older brother)"
      - headword: "阿姑"
        gloss: "aunt (father's sister)"
      - headword: "阿舅"
        gloss: "uncle (mother's brother)"
      - headword: "阿姨"
        gloss: "aunt (mother's sister)"
      - headword: "阿嬸"
        gloss: "aunt (uncle's wife)"
      - headword: "表兄"
        gloss: "older male cousin (mother's sibling's or father's sister's son, older than oneself)"
        note: "substitute for missing headword 表兄弟 (male cousin) — 表兄 is the existing (older) male-cousin term, a near-exact match"
      - headword: "外孫女"
        gloss: "granddaughter (daughter's daughter)"
        note: "review fix: replaces 姊妹, which stood in for 表姊妹 (female cousin, no headword in data/entries/) but actually just means 'one's own sisters' — not a cousin at all, and not worth mislabeling. 外孫女 is a real, distinct maternal-line grandchild term (paired with 外公/外媽 above), unlike the unmarked 孫女 below it — a genuine female-cousin term (表姐/表妹) still doesn't exist in the dataset and would need staging separately if this deck should represent that relation instead."
      - headword: "姪"
        gloss: "nephew; niece (fraternal)"
        note: "substitute for missing headword 姪仔 (nephew) — 姪 is the existing base form covering nephew/niece through a brother"
      - headword: "外甥女"
        gloss: "niece (sister's daughter)"
        note: "substitute for missing headword 姪女 (niece) — 外甥女 is the existing niece term (via sister rather than brother, since 姪女 itself isn't present and 姪 is already used)"
      - headword: "孫囝"
        gloss: "grandson"
        note: "substitute for missing headword 孫仔 (grandson) — matched gloss \"grandson\""
      - headword: "孫女"
        gloss: "granddaughter"
      - headword: "父母"
        gloss: "parents"
      - headword: "兄弟"
        gloss: "siblings"
        note: "substitute for missing headword 兄弟姊妹 (siblings) — matched gloss \"siblings\""
      - headword: "親戚"
        gloss: "relatives"
      - headword: "大家官"
        gloss: "in-laws"
        note: "substitute for missing headword 姻親 (in-laws) — matched gloss \"in-laws\""
      - headword: "丈母"
        gloss: "mother-in-law (wife's mother)"
        note: "review fix: replaces 婆婆, which the automated pass matched on the generic gloss \"mother-in-law\" but conventionally denotes the husband's mother (paternal side, from a wife's perspective) — the wrong direction for 岳母 (wife's mother, the concept originally intended, paired with 丈人 below). 丈母 is the dataset's dedicated wife's-mother term and pairs correctly with 丈人."
      - headword: "丈人"
        gloss: "father-in-law (wife's father)"
        note: "substitute for missing headword 岳父 (father-in-law) — 丈人 is the existing exact-match term for wife's father"
      - headword: "囝婿"
        gloss: "son-in-law"
        note: "substitute for missing headword 女婿 (son-in-law) — matched gloss \"son-in-law\""
      - headword: "新婦"
        gloss: "daughter-in-law"
      - headword: "雙生"
        gloss: "twins"
        note: "substitute for missing headword 雙生仔 (twins) — matched gloss \"twins\""
      - headword: "囝"
        gloss: "child, son, offspring"
        note: "substitute for missing headword 獨生仔 (only child) — no 'only child' term exists in data/entries/, so falling back to 囝 (child), the base kinship term for offspring"
      - headword: "長者"
        gloss: "elder, senior citizen, respected older person"
        note: "substitute for missing headword 長輩 (elders) — 長者 is the existing close-meaning term for a respected elder/senior person"
      - headword: "祖先"
        gloss: "ancestors"

