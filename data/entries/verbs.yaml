      - pos: particle
        gloss_en: [yes, right, correct (as a short affirmative answer)]
        gloss_zh: [對, 是]
        note: >-
          Attested as a one-word affirmative answer in Mandarin-influenced
          registers. Unconfirmed whether this is the primary colloquial
          affirmative in Teochew speech versus echoing the verb of the
          question — flagged for a speaker to confirm.
        examples:
          - hanzi: 是
            pengim: si6
            en: yes; that's right (as an answer)
    frequency: 5
    needs_review: true
    sources: [seed]

