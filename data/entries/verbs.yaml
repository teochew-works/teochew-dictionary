# Verbs 動詞.

entries:
  - id: ziah8-食
    headword: 食
    readings:
      - pengim: ziah8
    senses:
      - pos: verb
        gloss_en: [to eat, to consume]
        gloss_zh: [吃]
        examples:
          - hanzi: 食飽未
            pengim: ziah8 ba2 bhuê7
            en: Have you eaten yet? (a common greeting)
      - pos: verb
        gloss_en: [to drink (tea only)]
        gloss_zh: [喝（茶）]
        note: >-
          Covers both eating and drinking tea, unlike Mandarin, which uses 喝
          for the latter. Alcohol and water take 啉 instead — see 啉.
        examples:
          - hanzi: 食茶
            pengim: ziah8 dê5
            en: to drink tea
    frequency: 5
    sources: [seed]

  - id: ziah8-bng7-食飯
    headword: 食飯
    readings:
      - pengim: ziah8 bng7
    senses:
      - pos: verb
        gloss_en: [to eat, to have a meal]
        gloss_zh: [吃飯]
        note: The generic verb "to eat" in many everyday contexts, not limited to rice.
        examples:
          - hanzi: 我食飯
            pengim: ua2 ziah8 bng7
            en: I'm eating. / I eat.
    frequency: 5
    sources: [seed]

  - id: ziah8-ba2-bhuê7-食飽未
    headword: 食飽未
    readings:
      - pengim: ziah8 ba2 bhuê7
    senses:
      - pos: phrase
        gloss_en: [have you eaten?, how are you (a common greeting)]
        gloss_zh: [吃飽了嗎]
        note: >-
          The everyday greeting, literally "eaten full not-yet" — an enquiry
          after someone's wellbeing rather than a literal question about food.
          Its own entry rather than a sense on 食, 飽 or 未, since the gloss
          describes the whole string; cf. 新年好 and 多謝.
        examples:
          - hanzi: 你食飽未
            pengim: le2 ziah8 ba2 bhuê7
            en: Have you eaten yet? (addressed to someone)
    frequency: 4
    sources: [seed]

