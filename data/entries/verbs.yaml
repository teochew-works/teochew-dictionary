  - id: ke3-去
    headword: 去
    readings:
      - pengim: ke3
    senses:
      - pos: verb
        gloss_en: [to go, to leave]
        gloss_zh: [去]
        examples:
          - hanzi: 我去厝
            pengim: ua2 ke3 cu3
            en: I'm going home.
      - pos: particle
        gloss_en: [away, completely (as a verb complement marking a completed change of state)]
        gloss_zh: [掉, 去]
        note: >-
          Attached after a verb, parallel to Mandarin 賣掉/賣去 — distinct from
          the motion-verb sense above.
        examples:
          - hanzi: 賣去
            pengim: bhoi7 ke3
            en: sold off, all sold
    frequency: 5
    sources: [seed]

