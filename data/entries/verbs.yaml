  - id: u6-有
    headword: 有
    readings:
      - pengim: u6
    senses:
      - pos: verb
        gloss_en: [to have, there is, there are]
        gloss_zh: [有]
        examples:
          - hanzi: 伊有囝
            pengim: i1 u6 gian2
            en: He/she has a child.
      - pos: particle
        gloss_en: [marks that an action did happen (emphatic/perfective), did]
        gloss_zh: [有（完成貌標記）]
        note: >-
          A distinctive Southern Min feature shared with Hokkien: 有 placed
          before a verb emphasises that the action did occur, where Mandarin
          would rely on context or 了.
        examples:
          - hanzi: 我有食
            pengim: ua2 u6 ziah8
            en: I did eat. / I have eaten.
    frequency: 5
    sources: [seed]

