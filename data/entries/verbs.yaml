# Verbs 動詞.

entries:
  - id: ziah8-食
    headword: 食
    readings:
      - pengim: ziah8
    senses:
      - pos: verb
        gloss_en: [to eat, to drink, to consume]
        gloss_zh: [吃, 喝]
        note: >-
          Covers both eating and drinking, unlike Mandarin. 食茶 is "drink tea",
          not "eat tea".
        examples:
          - hanzi: 食飽未
            pengim: ziah8 ba2 bhuê6
            en: Have you eaten yet? (a common greeting)
    frequency: 5
    sources: [seed]

