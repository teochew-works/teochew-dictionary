  - id: gah4-佮
    headword: 佮
    readings:
      - pengim: gah4
      - pengim: kah4
      - pengim: han2
    senses:
      - pos: preposition
        gloss_en: [with]
        gloss_zh: [跟, 和]
        note: 3 candidate readings from Wiktionary — genuine Chaozhou colloquial form not yet confirmed by a speaker.
