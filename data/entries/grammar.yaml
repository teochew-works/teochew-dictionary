# Function words 虛詞 — prepositions, conjunctions.
#
# Merged from the Wiktionary import against the Swadesh-207 checklist
# (issue #5).

entries:
  - id: diu6-佇
    headword: 佇
    readings:
      - pengim: diu6
      - pengim: diu2
    senses:
      - pos: preposition
        gloss_en: [at, in, on (locative)]
        gloss_zh: [在]
        note: >-
          2 candidate readings from Wiktionary — genuine Chaozhou colloquial
          form not yet confirmed by a speaker. Function words like this often
          have thin Wiktionary coverage, so the ambiguity here is more about
          Wiktionary's data than the word itself.
        examples:
          - hanzi: 佇厝
            pengim: diu6 cu3
            en: at home
    frequency: 5
    needs_review: true
    sources: [wiktionary]
    retrieved: '2026-07-28'

  - id: lai6-內
    headword: 內
    readings:
      - pengim: lai6
    senses:
      - pos: preposition
        gloss_en: [in, inside]
        gloss_zh: [內, 裡面]
        note: Locative particle, may end up overlapping with 佇 "at" for some senses.
        examples:
          - hanzi: 厝內
            pengim: cu3 lai6
            en: inside the house
    frequency: 5
    sources: [wiktionary]
    retrieved: '2026-07-28'

  - id: gah4-佮
    headword: 佮
    readings:
      - pengim: gah4
      - pengim: kah4
      - pengim: han2
    senses:
      - pos: preposition
        gloss_en: [with]
        gloss_zh: [跟, 和]
        note: 3 candidate readings from Wiktionary — genuine Chaozhou colloquial form not yet confirmed by a speaker.
        examples:
          - hanzi: 我佮你去
            pengim: ua2 gah4 le2 ke3
            en: I'm going with you.
      - pos: conjunction
        gloss_en: [and]
        gloss_zh: [和, 與]
        note: Southern Min 佮 covers both the comitative ("with") and conjunctive ("and") senses, not a mistake — the two senses share this one entry.
        examples:
          - hanzi: 我佮你
            pengim: ua2 gah4 le2
            en: you and I
    frequency: 5
    needs_review: true
    sources: [wiktionary]
    retrieved: '2026-07-28'

