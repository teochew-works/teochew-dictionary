  - id: gah4-佮
    headword: 佮
    readings:
      - pengim: gah4
      - pengim: kah4
      - pengim: han2
    senses:
      - pos: preposition
        gloss_en: [with]
        gloss_zh: [跟, 和]
        note: 3 candidate readings from Wiktionary — genuine Chaozhou colloquial form not yet confirmed by a speaker.
        examples:
          - hanzi: 我佮你去
            pengim: ua2 gah4 le2 ke3
            en: I'm going with you.
      - pos: conjunction
        gloss_en: [and]
        gloss_zh: [和, 與]
        note: Southern Min 佮 covers both the comitative ("with") and conjunctive ("and") senses, not a mistake — the two senses share this one entry.
        examples:
          - hanzi: 我佮你
            pengim: ua2 gah4 le2
            en: you and I
    frequency: 5
    needs_review: true
    sources: [wiktionary]
    retrieved: '2026-07-28'

