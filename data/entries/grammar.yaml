entries:
  - id: diu6-佇
    headword: 佇
    readings:
      - pengim: diu6
      - pengim: diu2
    senses:
      - pos: preposition
        gloss_en: [at, in, on (locative)]
        gloss_zh: [在]
        note: >-
          2 candidate readings from Wiktionary — genuine Chaozhou colloquial
          form not yet confirmed by a speaker. Function words like this often
          have thin Wiktionary coverage, so the ambiguity here is more about
          Wiktionary's data than the word itself.
        examples:
          - hanzi: 佇厝
            pengim: diu6 cu3
            en: at home
    frequency: 5
    needs_review: true
    sources: [wiktionary]
    retrieved: '2026-07-28'

