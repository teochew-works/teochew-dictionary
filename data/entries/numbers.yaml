# Numerals 數詞.
#
# Several numerals have distinct colloquial (白讀) and literary (文讀) readings.
# Both are recorded, tagged by register, because which one is used is
# grammatically conditioned — 二 is `no6` when counting objects but `ri6` in
# compounds and higher numbers.

entries:
  - id: zeg8-一
    headword: 一
    readings:
      - pengim: zêg8
        register: colloquial
      - pengim: ig4
        register: literary
    senses:
      - pos: numeral
        gloss_en: [one, "1"]
        gloss_zh: [一]
    frequency: 5
    sources: [seed]

  - id: no6-二
    headword: 二
    readings:
      - pengim: no6
        register: colloquial
        note: Used when counting things.
      - pengim: ri6
        register: literary
        note: Used in compounds and in higher numbers (十二 zab8 ri6).
    senses:
      - pos: numeral
        gloss_en: [two, "2"]
        gloss_zh: [二]
    frequency: 5
    sources: [seed]

