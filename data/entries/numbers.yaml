# Numerals 數詞.
#
# Several numerals have distinct colloquial (白讀) and literary (文讀) readings
# of the same character, tagged by register (一, 八).
#
# 二/兩 is not one of these. `no6` and `ri7` are not two readings of one
# character — they are two different words: 兩 (來母 上聲 → 陽上 → tone 6),
# the word actually spoken when counting objects, conventionally written 二
# (訓讀); and 二 itself (日母 去聲 → 陽去 → tone 7), used in compounds and
# higher numbers. They are filed as separate entries below. See
# `data/phonology/REVIEW.md` §8 for the ruling.

entries:
  - id: zeg8-一
    headword: 一
    readings:
      - pengim: zêg8
        register: colloquial
      - pengim: ig4
        register: literary
    senses:
      - pos: numeral
        gloss_en: [one, "1"]
        gloss_zh: [一]
        examples:
          - hanzi: 一日
            pengim: zêg8 rig8
            en: one day
    frequency: 5
    sources: [seed]

  - id: no6-兩
    headword: 兩
    readings:
      - pengim: no6
        note: >-
          Conventionally written 二 when counting objects (訓讀); this is the
          etymon (來母 上聲 → 陽上). See REVIEW.md §8.
    senses:
      - pos: numeral
        gloss_en: [two, "2"]
        gloss_zh: [兩]
        note: Used when counting things. Written 二 in practice, not 兩.
        examples:
          - hanzi: 二日
            pengim: no6 rig8
            en: two days
    frequency: 5
    sources: [seed]

  - id: ri7-二
    headword: 二
    readings:
      - pengim: ri7
    senses:
      - pos: numeral
        gloss_en: [two, "2"]
        gloss_zh: [二]
        note: Used in compounds and in higher numbers, not when counting objects (see the no6-兩 entry).
        examples:
          - hanzi: 十二
            pengim: zab8 ri7
            en: twelve
    frequency: 5
    sources: [seed]

