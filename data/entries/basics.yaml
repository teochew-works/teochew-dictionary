  - id: bhue7-未
    headword: 未
    readings:
      - pengim: bhuê7
    senses:
      - pos: adverb
        gloss_en: [not yet]
        gloss_zh: [未, 沒有]
        examples:
          - hanzi: 未食
            pengim: bhuê7 ziah8
            en: hasn't eaten yet
      - pos: particle
        gloss_en: ["...yet? (sentence-final, forming a yes-no question)"]
        gloss_zh: [未（句末疑問）]
        note: >-
          Placed after the predicate, 未 turns a statement into a yes-no
          question — the ordinary Southern Min V-未 interrogative, as in 食飽未
          (cf. Hokkien tsia̍h-pá--buē) — distinct from the "not yet" negator
          sense above, which stands before the verb.
        examples:
          - hanzi: 食飽未
            pengim: ziah8 ba2 bhuê7
            en: Have you eaten yet? (a common greeting)
    frequency: 4
    sources: [seed]

