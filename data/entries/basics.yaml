  - id: gu7-ni5-舊年
    headword: 舊年
    readings:
      - pengim: gu7 ni5
    senses:
      - pos: noun
        gloss_en: [last year]
        gloss_zh: [去年]
        note: >-
          Idiomatic, not compositional — 舊 elsewhere means "old", but 舊年
          fixed together means "last year" (cf. Hokkien kū-nî), not "an old
          year".
        examples:
          - hanzi: 舊年我去中國
            pengim: gu7 ni5 ua2 ke3 dong1 gog4
            en: I went to China last year.
    frequency: 4
    sources: [seed]

