# Function words, time, and everyday expressions.

entries:
  - id: m6-毋
    headword: 毋
    readings:
      - pengim: m6
        note: >-
          Tone uncertain. As a grammaticalised negator this has no regular
          Middle Chinese source to derive a tone from, and the Hokkien cognate
          m̄ sits in the merged 陽上/陽去 class, which cannot distinguish tone 6
          from tone 7. Recorded as 6 pending a speaker.
    senses:
      - pos: adverb
        gloss_en: [not]
        gloss_zh: [不]
        note: >-
          A syllabic nasal with no vowel — one of a small set of such syllables
          alongside 黃 ng5.
        examples:
          - hanzi: 我毋知
            pengim: ua2 m6 zai1
            en: I don't know.
    frequency: 5
    needs_review: true
    sources: [seed]

