        gloss_en: [Shantou, Swatow]
        gloss_zh: [汕頭]
        note: >-
          The port city; "Swatow" is the older romanisation, still current in
          diaspora usage.
        examples:
          - hanzi: 汕頭儂
            pengim: suan1 tao5 nang5
            en: a person from Shantou
    tags: [placename]
    frequency: 5
    sources: [seed]

  - id: suan1-tao5-nang5-汕頭儂
