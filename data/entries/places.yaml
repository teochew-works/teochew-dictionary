# Place names and the language's own names 地名.

entries:
  - id: dio5-ziu1-潮州
    headword: 潮州
    readings:
      - pengim: dio5 ziu1
        variety: chaozhou
      - pengim: dio5 ziu1
        variety: shantou
        note: >-
          Same spelling, different realisation: [tie⁵⁵ tsiu³³] in Chaozhou city
          against [tio⁵⁵ tsiu³³] in Shantou. The derived IPA differs by variety
          while the Peng'im does not.
      - pengim: dio5 ziu1
        variety: chaoyang
        note: >-
          [tio⁵⁵ tsiu³³] — unfronted on `io` like Shantou. This word has no
          bare `e` syllable, so it doesn't show Chaoyang's other defining
          feature, the Southern /ɯ/→/u/ merger; see tests/derive.test.ts for a
          word that does.
    senses:
      - pos: proper-noun
        gloss_en: [Chaozhou, Teochew]
        gloss_zh: [潮州]
        note: A prefecture-level city in eastern Guangdong, and the region it names.
        examples:
          - hanzi: 潮州儂
            pengim: dio5 ziu1 nang5
            en: a Teochew person, a person from Chaozhou
    tags: [placename]
    frequency: 5
    sources: [seed]

  - id: dio5-ziu1-nang5-潮州儂
    headword: 潮州儂
    readings:
      - pengim: dio5 ziu1 nang5
    senses:
      - pos: noun
        gloss_en: [a Teochew person, a person from Chaozhou]
        gloss_zh: [潮州人]
        note: >-
          The literal, neutral term for a person from Chaozhou — contrast 家己儂,
          which carries in-group identity connotations rather than merely
          stating origin.
        examples:
          - hanzi: 我是潮州儂
            pengim: ua2 si6 dio5 ziu1 nang5
            en: I'm Teochew.
    tags: [placename]
    frequency: 4
    sources: [seed]

