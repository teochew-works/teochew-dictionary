  - id: ga1-gi6-nang5-家己儂
    headword: 家己儂
    readings:
      - pengim: ga1 gi6 nang5
        note: >-
          The tone on 己 is uncertain. By Middle Chinese it is 陰上 (見母 上聲),
          which predicts tone 2, so neither 6 nor 7 is regular — this is an
          irregular grammaticalised form. The compound gives no evidence
          either: 己 is non-final, and sandhi sends both 6 and 7 to 7. Settling
          it needs the word in isolation from a speaker.
    senses:
      - pos: noun
        gloss_en: [one's own people, a fellow Teochew]
        gloss_zh: [自己人]
        note: >-
          The community's own term for itself, widely romanised "gaginang" in
          diaspora usage. Saying it to a stranger asserts shared Teochew origin.
        examples:
          - hanzi: 咱是家己儂
            pengim: nang2 si6 ga1 gi6 nang5
            en: We're gaginang. (said to a fellow Teochew; 咱 includes the person spoken to)
    tags: [identity, culture]
    frequency: 4
    needs_review: true
    sources: [seed]

