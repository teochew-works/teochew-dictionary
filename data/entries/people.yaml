entries:
  - id: nang5-儂
    headword: 儂
    variants: [人]
    readings:
      - pengim: nang5
    senses:
      - pos: noun
        gloss_en: [person, people]
        gloss_zh: [人]
        note: >-
          儂 is the character conventionally used in Teochew writing for the
          colloquial word; 人 is the same morpheme written with the standard
          Chinese character.
        examples:
          - hanzi: 大儂
            pengim: dua7 nang5
            en: an adult
    frequency: 5
    sources: [seed]

