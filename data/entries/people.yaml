  - id: a1-ma2-阿媽
    headword: 阿媽
    readings:
      - pengim: a1 ma2
    senses:
      - pos: noun
        gloss_en: [grandmother]
        gloss_zh: [奶奶]
        note: >-
          Contrast Cantonese 阿媽, which means "mother". The Teochew term refers
          to a grandmother.
        examples:
