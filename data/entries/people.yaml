  - id: hian1-兄
    headword: 兄
    readings:
      - pengim: hian1
    senses:
      - pos: noun
        gloss_en: [elder brother]
        gloss_zh: [哥哥]
        note: >-
          Usually appears with the 阿- prefix, like 阿爸 and 阿媽; bare 兄 is
          largely bound in Southern Min (cf. Hokkien a-hiaⁿ). Not confirmed
          for Teochew specifically.
        examples:
          - hanzi: 阿兄
            pengim: a1 hian1
            en: elder brother (in address and reference)
    frequency: 4
    needs_review: true
    sources: [seed]

