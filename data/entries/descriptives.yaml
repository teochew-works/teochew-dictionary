    senses:
      - pos: adjective
        gloss_en: [hot (of weather)]
        gloss_zh: [熱]
        note: >-
          Southern Min splits "hot": 熱 covers weather and climate, while a hot
          object or liquid takes 燒 (cf. Hokkien sio) — see 燒. The boundary is
          not confirmed for Teochew specifically, so the restriction in the
          gloss is provisional.
        examples:
          - hanzi: 熱日
            pengim: ruah8 rig8
            en: a hot day
    frequency: 4
    needs_review: true
    sources: [seed]

  - id: zoi7-濟
    headword: 濟
    readings:
      - pengim: zoi7
        note: >-
          The graph is a 借字: 濟's own reading is 陰去 (tone 3), so the tone comes
          from the spoken etymon rather than the character. The cross-Min
          cognate (Hokkien tsē) is in the 陽 departing class, giving 陽去.
    senses:
      - pos: adjective
        gloss_en: [many, much, a lot]
        gloss_zh: [多]
        note: Teochew uses 濟 where Mandarin uses 多.
        examples:
          - hanzi: 濟儂
            pengim: zoi7 nang5
            en: many people, a lot of people
    frequency: 5
    sources: [seed]

