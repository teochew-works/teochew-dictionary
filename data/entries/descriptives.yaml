# Descriptives 形容詞.
#
# Teochew descriptives function as stative verbs — 好 can head a predicate on its
# own without a copula — but they are tagged `adjective` here to keep the
# part-of-speech vocabulary small and familiar.

entries:
  - id: ho2-好
    headword: 好
    readings:
      - pengim: ho2
    senses:
      - pos: adjective
        gloss_en: [good, well, fine]
        gloss_zh: [好]
        examples:
          - hanzi: 好儂
            pengim: ho2 nang5
            en: a good person
      - pos: particle
        gloss_en: [done, finished, ready (as a verb complement)]
        gloss_zh: [好, 完]
        note: >-
          Attached after a verb to mark completion, as in Mandarin 做好 —
          distinct from the "good" sense above.
        examples:
          - hanzi: 做好
            pengim: zo3 ho2
            en: finished making/doing (it)
    frequency: 5
    sources: [seed]

  - id: pai2-歹
    headword: 歹
    readings:
      - pengim: pai2
    senses:
      - pos: adjective
        gloss_en: [bad, spoiled, broken]
        gloss_zh: [壞, 不好]
        examples:
          - hanzi: 歹儂
            pengim: pai2 nang5
            en: a bad person
          - hanzi: 魚歹去
            pengim: he5 pai2 ke3
            en: The fish has gone off.
      - pos: prefix
        gloss_en: [hard to, unpleasant to (before a verb)]
        gloss_zh: [難]
        note: >-
          Filed as a productive prefix — the antonym of the 好- frame the
          dataset already records as 好食, 好看 and 好聽 — on the strength of
          the parallel Hokkien pattern (cf. pháiⁿ-tsia̍h, pháiⁿ-khòaⁿ), which is
          fully productive there. But that parallel cuts both ways: 好食, 好看
          and 好聽 are each filed in this dataset as their own lexicalised
          adjective entry, not as a sense of 好, precisely because they read as
          fixed words rather than a live 好- + V pattern. Whether 歹食 is
          similarly fixed (favouring its own entry, as 好食 got) or genuinely
          productive (favouring the prefix sense recorded here) is not
          confirmed for Teochew — see REVIEW.md.
        examples:
          - hanzi: 歹食
            pengim: pai2 ziah8
            en: bad-tasting, unpalatable
    frequency: 4
    needs_review: true
    sources: [seed]

