  - id: zoi7-濟
    headword: 濟
    readings:
      - pengim: zoi7
        note: >-
          The graph is a 借字: 濟's own reading is 陰去 (tone 3), so the tone comes
          from the spoken etymon rather than the character. The cross-Min
          cognate (Hokkien tsē) is in the 陽 departing class, giving 陽去.
    senses:
      - pos: adjective
        gloss_en: [many, much, a lot]
        gloss_zh: [多]
        note: Teochew uses 濟 where Mandarin uses 多.
        examples:
          - hanzi: 濟儂
            pengim: zoi7 nang5
            en: many people, a lot of people
    frequency: 5
    sources: [seed]

