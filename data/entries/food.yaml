            en: pork (lit. "pig meat")
    frequency: 5
    sources: [seed]

  - id: cai3-菜
    headword: 菜
    readings:
      - pengim: cai3
    senses:
      - pos: noun
        gloss_en: [vegetable, dish of food]
        gloss_zh: [菜]
        examples:
          - hanzi: 食菜
            pengim: ziah8 cai3
            en: to eat vegetables; to be vegetarian
            note: 食菜 idiomatically means "to be vegetarian" (esp. for Buddhist reasons), not just "to eat vegetables".
    frequency: 5
    sources: [seed]

  - id: gue2-粿
    headword: 粿
    readings:
      - pengim: guê2
    senses:
      - pos: noun
        gloss_en: [rice cake, steamed or fried rice-flour cake]
        gloss_zh: [粿]
        note: >-
          A whole category of Teochew foods rather than a single item
          (紅桃粿, 菜頭粿, 鼠麴粿).
        examples:
          - hanzi: 食粿
            pengim: ziah8 guê2
            en: to eat rice cake
    frequency: 5
    sources: [seed]

