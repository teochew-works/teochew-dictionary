# Food and drink 食物.
#
# A dense area of everyday Teochew vocabulary, and one where the colloquial
# stratum diverges most sharply from Mandarin — 糜 for congee, 粿 for the whole
# family of rice-flour cakes.

entries:
  - id: bng7-飯
    headword: 飯
    readings:
      - pengim: bng7
    senses:
      - pos: noun
        gloss_en: [cooked rice, a meal]
        gloss_zh: [飯]
        examples:
          - hanzi: 食飯
            pengim: ziah8 bng7
            en: to eat a meal
    frequency: 5
    sources: [seed]

  - id: mue5-糜
    headword: 糜
    readings:
      - pengim: muê5
    senses:
      - pos: noun
        gloss_en: [congee, rice porridge]
        gloss_zh: [粥]
        note: >-
          The everyday Teochew breakfast staple. Mandarin 粥 corresponds, but 糜
          is the character used in Teochew writing.
        examples:
          - hanzi: 食糜
            pengim: ziah8 muê5
            en: to eat congee (esp. for breakfast)
    frequency: 5
    sources: [seed]

  - id: de5-茶
    headword: 茶
    readings:
      - pengim: dê5
    senses:
      - pos: noun
        gloss_en: [tea]
        gloss_zh: [茶]
        examples:
          - hanzi: 食茶
            pengim: ziah8 dê5
            en: to drink tea
            note: Teochew uses 食 for drinking tea, not 啉.
    frequency: 5
    sources: [seed]

