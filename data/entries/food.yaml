# Food and drink 食物.
#
# A dense area of everyday Teochew vocabulary, and one where the colloquial
# stratum diverges most sharply from Mandarin — 糜 for congee, 粿 for the whole
# family of rice-flour cakes.

entries:
  - id: bng7-飯
    headword: 飯
    readings:
      - pengim: bng7
    senses:
      - pos: noun
        gloss_en: [cooked rice, a meal]
        gloss_zh: [飯]
        examples:
          - hanzi: 食飯
            pengim: ziah8 bng7
            en: to eat a meal
    frequency: 5
    sources: [seed]

  - id: mue5-糜
    headword: 糜
    readings:
      - pengim: muê5
    senses:
      - pos: noun
        gloss_en: [congee, rice porridge]
        gloss_zh: [粥]
        note: >-
          The everyday Teochew breakfast staple. Mandarin 粥 corresponds, but 糜
          is the character used in Teochew writing.
        examples:
          - hanzi: 食糜
            pengim: ziah8 muê5
            en: to eat congee (esp. for breakfast)
    frequency: 5
    sources: [seed]

  - id: de5-茶
    headword: 茶
    readings:
      - pengim: dê5
    senses:
      - pos: noun
        gloss_en: [tea]
        gloss_zh: [茶]
        examples:
          - hanzi: 食茶
            pengim: ziah8 dê5
            en: to drink tea
            note: Teochew uses 食 for drinking tea, not 啉.
    frequency: 5
    sources: [seed]

  - id: zui2-水
    headword: 水
    readings:
      - pengim: zui2
    senses:
      - pos: noun
        gloss_en: [water]
        gloss_zh: [水]
        examples:
          - hanzi: 啉水
            pengim: lim1 zui2
            en: to drink water
    frequency: 5
    sources: [seed]

  - id: he5-魚
    headword: 魚
    readings:
      - pengim: he5
    senses:
      - pos: noun
        gloss_en: [fish]
        gloss_zh: [魚]
        examples:
          - hanzi: 食魚
            pengim: ziah8 he5
            en: to eat fish
    frequency: 5
    sources: [seed]

  - id: neg8-肉
    headword: 肉
    readings:
      - pengim: nêg8
    senses:
      - pos: noun
        gloss_en: [meat, flesh]
        gloss_zh: [肉]
        examples:
          - hanzi: 豬肉
            pengim: de1 nêg8
            en: pork (lit. "pig meat")
    frequency: 5
    sources: [seed]

  - id: cai3-菜
    headword: 菜
    readings:
      - pengim: cai3
    senses:
      - pos: noun
        gloss_en: [vegetable, dish of food]
        gloss_zh: [菜]
        examples:
          - hanzi: 食菜
            pengim: ziah8 cai3
            en: to eat vegetables; to be vegetarian
            note: 食菜 idiomatically means "to be vegetarian" (esp. for Buddhist reasons), not just "to eat vegetables".
    frequency: 5
    sources: [seed]

  - id: gue2-粿
    headword: 粿
    readings:
      - pengim: guê2
    senses:
      - pos: noun
        gloss_en: [rice cake, steamed or fried rice-flour cake]
        gloss_zh: [粿]
        note: >-
          A whole category of Teochew foods rather than a single item
          (紅桃粿, 菜頭粿, 鼠麴粿).
        examples:
          - hanzi: 食粿
            pengim: ziah8 guê2
            en: to eat rice cake
    frequency: 5
    sources: [seed]

