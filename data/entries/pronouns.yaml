# Pronouns 代詞.
#
# Teochew distinguishes clusivity in the first person plural: 阮 excludes the
# addressee, 咱 includes them. English collapses both to "we", so the glosses
# carry the distinction explicitly.

entries:
  - id: ua2-我
    headword: 我
    readings:
      - pengim: ua2
    senses:
      - pos: pronoun
        gloss_en: [I, me]
        gloss_zh: [我]
        examples:
          - hanzi: 我愛食飯
            pengim: ua2 ai3 ziah8 bng7
            en: I want to eat.
    frequency: 5
    sources: [seed]

  - id: le2-你
    headword: 你
    variants: [汝]
    readings:
      - pengim: le2
    senses:
      - pos: pronoun
        gloss_en: [you (singular)]
        gloss_zh: [你]
        examples:
          - hanzi: 你好
            pengim: le2 ho2
            en: hello
    frequency: 5
    sources: [seed]

  - id: i1-伊
    headword: 伊
    readings:
      - pengim: i1
    senses:
      - pos: pronoun
        gloss_en: [he, she, it, him, her]
        gloss_zh: [他, 她, 它]
        note: Not marked for gender.
        examples:
          - hanzi: 伊是我朋友
            pengim: i1 si6 ua2 bêng5 iu2
            en: He/she is my friend.
    frequency: 5
    sources: [seed]

  - id: uang2-阮
