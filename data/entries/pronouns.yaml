            pengim: nang2 ke3 ziah8 bng7
            en: Let's go and eat. (咱 includes the person spoken to)
    tags: [inclusive]
    frequency: 4
    sources: [seed]

  - id: ning2-恁
    headword: 恁
    readings:
      - pengim: ning2
    senses:
