# Pronouns 代詞.
#
# Teochew distinguishes clusivity in the first person plural: 阮 excludes the
# addressee, 咱 includes them. English collapses both to "we", so the glosses
# carry the distinction explicitly.

entries:
  - id: ua2-我
    headword: 我
    readings:
      - pengim: ua2
    senses:
      - pos: pronoun
        gloss_en: [I, me]
        gloss_zh: [我]
    frequency: 5
    sources: [seed]

  - id: le2-你
    headword: 你
    variants: [汝]
    readings:
      - pengim: le2
    senses:
      - pos: pronoun
        gloss_en: [you (singular)]
        gloss_zh: [你]
    frequency: 5
    sources: [seed]

  - id: i1-伊
    headword: 伊
    readings:
