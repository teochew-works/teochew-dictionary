            pengim: uang2 si6 ga1 gi6 nang5
            en: We're gaginang (fellow Teochew people).
    tags: [exclusive]
    frequency: 5
    sources: [seed]

  - id: nang2-咱
    headword: 咱
    readings:
      - pengim: nang2
    senses:
