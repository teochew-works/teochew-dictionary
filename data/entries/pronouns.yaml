# Pronouns 代詞.
#
# Teochew distinguishes clusivity in the first person plural: 阮 excludes the
# addressee, 咱 includes them. English collapses both to "we", so the glosses
# carry the distinction explicitly.

entries:
  - id: ua2-我
    headword: 我
    readings:
      - pengim: ua2
    senses:
      - pos: pronoun
        gloss_en: [I, me]
        gloss_zh: [我]
        examples:
          - hanzi: 我愛食飯
            pengim: ua2 ai3 ziah8 bng7
            en: I want to eat.
    frequency: 5
    sources: [seed]

  - id: le2-你
    headword: 你
    variants: [汝]
    readings:
      - pengim: le2
    senses:
      - pos: pronoun
        gloss_en: [you (singular)]
        gloss_zh: [你]
        examples:
          - hanzi: 你好
            pengim: le2 ho2
            en: hello
    frequency: 5
    sources: [seed]

  - id: i1-伊
    headword: 伊
    readings:
      - pengim: i1
    senses:
      - pos: pronoun
        gloss_en: [he, she, it, him, her]
        gloss_zh: [他, 她, 它]
        note: Not marked for gender.
        examples:
          - hanzi: 伊是我朋友
            pengim: i1 si6 ua2 bêng5 iu2
            en: He/she is my friend.
    frequency: 5
    sources: [seed]

  - id: uang2-阮
    headword: 阮
    readings:
      - pengim: uang2
    senses:
      - pos: pronoun
        gloss_en: [we, us (excluding the person spoken to)]
        gloss_zh: [我們（不包括聽話人）]
        examples:
          - hanzi: 阮是家己儂
            pengim: uang2 si6 ga1 gi6 nang5
            en: We're gaginang (fellow Teochew people).
    tags: [exclusive]
    frequency: 5
    sources: [seed]

  - id: nang2-咱
    headword: 咱
    readings:
      - pengim: nang2
    senses:
      - pos: pronoun
        gloss_en: [we, us (including the person spoken to)]
        gloss_zh: [咱們（包括聽話人）]
    tags: [inclusive]
    frequency: 4
    sources: [seed]

  - id: ning2-恁
    headword: 恁
    readings:
      - pengim: ning2
    senses:
      - pos: pronoun
        gloss_en: [you (plural)]
        gloss_zh: [你們]
        examples:
          - hanzi: 恁是阮朋友
            pengim: ning2 si6 uang2 bêng5 iu2
            en: You(pl) are our friends.
    frequency: 5
    sources: [seed]

  - id: sim2-mih8-乜
    headword: 乜
    readings:
      - pengim: mih8
    senses:
      - pos: pronoun
        gloss_en: [what]
        gloss_zh: [甚麼]
    frequency: 4
    needs_review: true
    sources: [seed]

  - id: di6-diang5-底儂
    headword: 底儂
    readings:
      - pengim: di6 nang5
        note: >-
          The tone on 底 is uncertain. By Middle Chinese it is 陰上 (端母 上聲),
          which predicts tone 2, so neither 6 nor 7 is regular — this is an
          irregular grammaticalised interrogative. The id also records 儂 as
          `diang5` against the reading's `nang5`; both need confirming.
    senses:
      - pos: pronoun
        gloss_en: [who]
        gloss_zh: [誰]
    frequency: 4
    needs_review: true
    sources: [seed]
