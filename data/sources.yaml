# Provenance registry. Every entry cites at least one source id from this file,
# and the validator rejects ids that are not listed here.
#
# Every source has a `kind`: `import` (the default — material is copied out of
# it into the dataset, so `licence` is required) or `reference` (cited as
# evidence, e.g. for a phonology mapping's `confidence`, but never reproduced —
# `licence` is optional, since no licence obligation attaches to material that
# was never copied). An entry's `sources:` may only cite `kind: import` ids;
# a phonology mapping's `sources:` may cite either — see the "Reference works"
# section below. The validator rejects an entry that cites a `reference` id
# rather than silently accepting it.
#
# Licence hygiene matters for a lexicon: glosses and example sentences are
# copyrightable even when individual pronunciations are not, so imported material
# must carry its licence with it and stay separable from hand-written material.
#
# An entry's own licence is DERIVED from this file, never hand-written — see
# src/data/licence.ts. The rule: CC-BY-4.0 (the data default — deliberately
# NOT this repo's code licence, BSD-3-Clause; see LICENSE-DATA-CC-BY-4.0)
# unless a cited source is share-alike, in which case that licence covers the
# whole entry. Separately, every cited source whose licence differs from
# CC-BY-4.0 (share-alike or not) is listed in the entry's `attributions` — a
# permissive-but-distinct licence, e.g. `unihan`'s Unicode-DFS-2016, never
# changes which licence governs the entry, but its notice still has to be
# retained, which is why there's a LICENSE-DATA-* file per distinct licence
# text in this file, not just one for the share-alike case.

sources:
  - id: seed
    name: Hand-curated seed set
    kind: import
    licence: CC-BY-4.0
    note: >-
      Written by hand to bootstrap the dataset and exercise the tooling
      end to end. Core everyday vocabulary where forms are widely agreed.
      Not yet checked by a native speaker — treat tone assignments in
      particular as provisional.

  - id: wiktionary
    name: Wiktionary (Teochew pronunciation sections)
    kind: import
    licence: CC-BY-SA-4.0
    url: https://en.wiktionary.org/
    note: >-
      Share-alike. Derived work must keep the licence. Attribution is per-entry
      via this id plus the `retrieved` date recorded by the importer.

  - id: cedict
    name: CC-CEDICT
    kind: import
    licence: CC-BY-SA-4.0
    url: https://www.mdbg.net/chinese/dictionary?page=cedict
    note: >-
      Mandarin-Chinese/English glosses. Useful as a gloss base for shared hanzi,
      but carries NO Teochew pronunciation — never let a CC-CEDICT import
      populate a reading.

  - id: unihan
    name: Unihan Database
    kind: import
    licence: Unicode-DFS-2016
    url: https://www.unicode.org/charts/unihan.html
    note: >-
      Character-level metadata (radical, stroke count, variants). Permissive.

  # ─── Reference works (kind: reference) ─────────────────────────────────────
  #
  # Cited by phonology mappings (`sources:` in varieties/*.yaml) to record the
  # evidence behind a `confidence`. These are consulted, not imported: no text is
  # reproduced, and a phoneme mapping is a fact rather than an expressive work.
  # Per the header above, pronunciations are not copyrightable even where glosses
  # are, so citing them here creates no licence obligation on the dataset — hence
  # `kind: reference`, which also keeps the validator from letting one of these
  # back an entry directly, `wikipedia`'s share-alike licence included.

  - id: pengim-1960
    name: 廣東省教育廳《潮州話拼音方案》(1960)
    kind: reference
    note: >-
      The scheme that defines Peng'im itself, already named in
      phonology/pengim.yaml. Authoritative for what the orthography MEANS — it is
      the document that assigns `ê` to /e/ and bare `e` to /ɯ/, so for questions
      about the letters it is definitional rather than merely descriptive. Based
      on the Swatow (汕頭) dialect. Cited, never reproduced.

  - id: wikipedia
    name: Wikipedia (Teochew Min, Peng'im)
    kind: reference
    licence: CC-BY-SA-4.0
    url: https://en.wikipedia.org/
    retrieved: '2026-07-27'
    note: >-
      Share-alike, and therefore usable here only for facts — never for wording.
      Distinct from the `wiktionary` id, which covers per-entry pronunciation
      imports. Useful mainly for the sub-dialect classification, which no single
      grammar states as compactly.

  - id: learnteochew
    name: Learn Teochew (learnteochew.com)
    kind: reference
    url: https://learnteochew.com/pages/pronunciation.html
    retrieved: '2026-07-27'
    note: >-
      A pedagogical Peng'im reference with an explicit vowel table. Valued here
      as corroboration independent of the Wikipedia family of texts. Cited, never
      reproduced.

  - id: zhang-2021-tonotypes
    name: 'Zhang, Jingfen. Tono-types and Tone Evolution: The Case of Chaoshan (2021)'
    kind: reference
    url: https://books.google.com/books?id=liASEAAAQBAJ
    retrieved: '2026-07-29'
    note: >-
      Springer Nature monograph on Chaoshan tone systems; ISBN 978-981-334-870-7.
      The academic source underlying the Chaozhou/Chenghai tone sandhi table in
      the `wikipedia` id's Teochew Min article, itself checked directly against
      that article's page markup (not merely a search summary) to confirm the
      exact Chao pitch numbers. Used for `sandhi/chaozhou.yaml`. Cited, never
      reproduced.
