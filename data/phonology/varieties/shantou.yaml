# Shantou (汕頭) — a sparse OVERLAY on the Chaozhou reference variety.
#
# Only differences are listed; anything absent is inherited from chaozhou.yaml.
# Keeping the overlay minimal is the point: the file doubles as a readable
# statement of how the two varieties actually differ.

variety:
  id: shantou
  name: Shantou
  name_zh: 汕頭話
  region: 汕頭市, Guangdong
  inherits: chaozhou

# NO `nuclei` block, and that absence is the point — see REVIEW.md §1.
#
# This file previously overrode `e` to /u/, on the belief that Shantou merges the
# Chaozhou high back unrounded /ɯ/. That was wrong. Swatow (urban Shantou) is
# NORTHERN Teochew and keeps /ɯ/; the merger into /u/ belongs to the Southern
# group — Chaoyang, Puning, Huilai. Peng'im settles it from the other direction
# too: the 1960 scheme is based on the Swatow dialect and gives bare `e` the value
# /ɯ/, so a Swatow overlay contradicting that contradicts its own orthography.
#
# Shantou therefore inherits /ɯ/ from Chaozhou, and what actually separates the
# two varieties is the `io` rime below plus the tone-2 contour.

irregular:
  # Chaozhou overrides these rimes to the fronted [ie] forms, so Shantou must
  # override them back — an overlay can add or replace keys, never delete them.
  io:
    ipa: io
    confidence: medium
    sources: [wikipedia, learnteochew]
    note: "Shantou keeps [io] where Chaozhou fronts to [ie]."
  ioh:
    ipa: ioʔ
    confidence: medium
    sources: [wikipedia, learnteochew]
    note: >-
      Wikipedia names Chaozhou/Chenghai specifically as fronting /ioʔ/ →
      /ieʔ/, implying other varieties (Shantou included) retain /ioʔ/ —
      indirect but real support.
  iong:
    ipa: ioŋ
    confidence: low
    note: >-
      No source addresses this nasal-coda rime specifically for either
      variety — see the parallel note on Chaozhou's `irregular.iong`. This
      value is the unmarked/non-fronted default carried over from the
      attested open-rime pattern, not independently sourced. Lowered from
      medium to low to match Chaozhou's parallel entry: both are uncited
      editorial extrapolations from the same open-rime pattern, and neither
      should read as better-supported than the other.

tones:
  # Shantou is commonly described with a higher dark-rising than Chaozhou.
  2: "52"
